# one service: builds the React app, then Express serves it + the API
services:
  - type: web
    name: loghound-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
